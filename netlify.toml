# Netlify: the pages are static files in dist/, and the API runs as one function (netlify/functions/api.js).
# Needed environment variables (Site configuration > Environment variables):
#   GEMINI_API_KEY, DATABASE_URL (a Postgres connection string), SESSION_SECRET
[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# /api/* goes to the function. "force" keeps it from ever being answered by a static file.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single-page app: every other address that isn't a real file gets the app, and the browser routes it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    Strict-Transport-Security = "max-age=15552000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Libraries never change between deploys: let browsers keep them.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
